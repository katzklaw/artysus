<style>
  /* Layout: a crew manifest. Wide rows, picture tiles on the left, name and description on the right. Two columns on wide screens, one on phones. */
  :root {
    --bg: #eceff6;
    --surface: #ffffff;
    --fg: #171a2c;
    --muted: #596079;
    --line: #d3d8e6;
    --accent: #0b7f86;
    --pic-bg: #151a2c;
    --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e101b;
      --surface: #1a1d2d;
      --fg: #eceefa;
      --muted: #a0a5bf;
      --line: #2b2f46;
      --accent: #4fd1c5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e101b;
    --surface: #1a1d2d;
    --fg: #eceefa;
    --muted: #a0a5bf;
    --line: #2b2f46;
    --accent: #4fd1c5;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 40px 56px;
  }
  .wrap { max-width: 960px; margin-inline: auto; display: grid; gap: 28px; }

  header { display: grid; gap: 8px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.25rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--muted); max-width: 60ch; }

  .roster {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
    gap: 14px;
  }
  .card {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 16px;
    align-items: start;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .pics { display: flex; flex-direction: column; gap: 8px; }
  .pic {
    position: relative;
    width: 88px;
    height: 88px;
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--pic-bg);
    overflow: hidden;
  }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pic .tag {
    position: absolute;
    inset: auto 0 0 0;
    padding: 2px 0;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    background: rgba(14, 16, 27, 0.8);
    color: #fff;
  }

  .body { min-width: 0; display: grid; gap: 4px; }
  .name {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.3rem;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .facts { margin: 2px 0 4px; padding: 0; list-style: none; display: grid; gap: 1px; }
  .facts li { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.03em; }
  .facts .k { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-right: 8px; }
  .facts .v { font-weight: 600; }
  .desc { margin: 0; color: var(--fg); font-size: 0.97rem; max-width: 62ch; }
  .desc.empty { color: var(--muted); font-style: italic; }
  .note { margin: 6px 0 0; color: var(--muted); font-size: 0.8rem; line-height: 1.4; max-width: 62ch; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Roster</div>
    <h1>My Among Us Characters</h1>
    <p class="lede">The crew I play as, with a picture and a note on each.</p>
  </header>

  <ul class="roster" id="roster"></ul>
</div>

  // Edit this list to change the roster. "imgs" lists picture keys; the first is the main picture, any others are alternates.
  var characters = [
    { name: "Artful Dodger", imgs: ["dodger", "dodger_alt"], sex: "Male", role: "Imp", note: "His name comes from the novel Oliver Twist.", desc: "Not evil, just chaotic. Dodger is chaos with a knife in his hand. His alternate look is the version of him trying to give up his old ways, though trouble still finds him." },
    { name: "Katzklaw", imgs: ["katzklaw"], sex: "Female", role: "Crew", desc: "Just me, with no special persona or quirks. Katzklaw is silly and very chatty." },
    { name: "Drishti", imgs: ["drishti"], sex: "Female", role: "Crew", canon: "Detective", note: "Her name is Sanskrit for “sight” or “vision.”", desc: "Quiet and serious. Drishti pays close attention and takes notes. She is similar to Etsija, but doesn't lead the meetings." },
    { name: "Etsija", imgs: ["etsija"], sex: "Female", role: "Crew", canon: "Detective", note: "Her name is Finnish for “seeker” or “hunter.” She is mentally taxing for me to play, so she isn't seen often.", desc: "Very serious. Etsija actively leads meetings to collect information and call votes." },
    { name: "RoseMaylie", imgs: ["rosemaylie"], sex: "Female", role: "Crew", note: "Her name, and her pure and innocent character, come from Oliver Twist, like Artful Dodger’s.", desc: "Pure, innocent and sweet, and a little air-headed. She gets offended when she is sussed and will vote for anyone who says it, as payback." },
    { name: "Vuk", imgs: ["vuk"], sex: "Male", role: "Imp", canon: "Phantom (Tracker as crew)", note: "His name is Serbian for “wolf.”", desc: "A quiet hunter who prefers to observe. Vuk stays silent unless he is questioned." },
    { name: "WarrenPeas", imgs: ["warrenpeas"], sex: "Male", role: "Crew", note: "Punny name is punny.", desc: "A little stiff and formal. If Warren is questioned with suspicion, he clams up and turns hostile, because he considers it an interrogation. After that, all you will get out of him is his name, rank and serial number." },
    { name: "Shaw", imgs: ["shaw"], sex: "Male", role: "Crew", canon: "Tracker", desc: "Grumpy. Shaw is a crewmate, but he will stab you anyway." },
    { name: "Jynx", imgs: ["jynx"], sex: "Female", role: "Imp", canon: "Viper", desc: "A happy-go-lucky free spirit. Not evil at all, but not afraid of a little blood either. She has a lisssp." },
    { name: "Dot", imgs: ["dot"], sex: "Female", role: "Crew", canon: "Scientist", desc: "Still in development. Dot's personality is a work in progress." },
    { name: "Del", imgs: ["del"], sex: "???", role: "Imp", desc: "A pacifist imp, sort of, though not out of kindness. Del avoids killing so as not to attract unwanted attention. It is much less “we can live in peace and harmony” and more “leave me alone, and I’ll leave you alone.” Del has no patience for sloppy kills that rile up the crewmates and get people ejected. Del will kill in self-defense or to defend a partner, but otherwise stays out of trouble, provides support, and aggressively yeets sloppy imps." },
    { name: "Cerise", imgs: ["cerise"], sex: "Female", role: "Crew", desc: "Alert and slightly outspoken, and she votes a bit more aggressively in meetings. In rounds, that alertness turns into timidity: she won’t start a task while she is being watched unless there are at least five crewmates present (herself included) or the only crewmates in view are verified hard clear. Otherwise she watches or moves elsewhere. A task she has already started usually won’t be interrupted." },
    { name: "Roimata", imgs: ["bag"], sex: "Female", role: "Crew", note: "Her name is Māori for “teardrop.” I only play her when I am sad in real life.", desc: "Sad and quiet. Hug plz." }
  ];

  var list = document.getElementById("roster");
  characters.forEach(function (c) {
    var li = document.createElement("li");
    li.className = "card";

    var pics = document.createElement("div");
    pics.className = "pics";
    c.imgs.forEach(function (key, i) {
      var fig = document.createElement("figure");
      fig.className = "pic";
      var im = document.createElement("img");
      im.src = IMG[key];
      im.alt = c.name + (i > 0 ? ", alternate appearance" : "");
      fig.appendChild(im);
      if (i > 0) {
        var t = document.createElement("span");
        t.className = "tag";
        t.textContent = "Alt";
        fig.appendChild(t);
      }
      pics.appendChild(fig);
    });

    var body = document.createElement("div");
    body.className = "body";
    var h = document.createElement("h2");
    h.className = "name";
    h.textContent = c.name;
    var p = document.createElement("p");
    p.className = "desc" + (c.desc ? "" : " empty");
    p.textContent = c.desc || "Description coming soon.";
    body.appendChild(h);
    var facts = [["Sex", c.sex], ["Crew/Imp", c.role], ["Canon role", c.canon]].filter(function (f) { return f[1]; });
    if (facts.length) {
      var ul = document.createElement("ul");
      ul.className = "facts";
      facts.forEach(function (f) {
        var li2 = document.createElement("li");
        var k = document.createElement("span");
        k.className = "k";
        k.textContent = f[0];
        var v = document.createElement("span");
        v.className = "v";
        v.textContent = f[1];
        li2.appendChild(k);
        li2.appendChild(v);
        ul.appendChild(li2);
      });
      body.appendChild(ul);
    }
    body.appendChild(p);
    if (c.note) {
      var n = document.createElement("p");
      n.className = "note";
      n.textContent = c.note;
      body.appendChild(n);
    }

    li.appendChild(pics);
    li.appendChild(body);
    list.appendChild(li);
  });
</script>
