<title>Crewbait's Characters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Chivo+Mono:wght@400;600&display=swap">
<style>
  /* Layout: a crew manifest. Wide rows, picture tiles on the left, name and description on the right. Two columns on wide screens, one on phones. */
  :root {
    --bg: #eceff6;
    --surface: #ffffff;
    --fg: #171a2c;
    --muted: #596079;
    --line: #d3d8e6;
    --accent: #0b7f86;
    --pic-bg: #151a2c;
    --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e101b;
      --surface: #1a1d2d;
      --fg: #eceefa;
      --muted: #a0a5bf;
      --line: #2b2f46;
      --accent: #4fd1c5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e101b;
    --surface: #1a1d2d;
    --fg: #eceefa;
    --muted: #a0a5bf;
    --line: #2b2f46;
    --accent: #4fd1c5;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 40px 56px;
  }
  .wrap { max-width: 960px; margin-inline: auto; display: grid; gap: 28px; }

  header { display: grid; gap: 14px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.25rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--muted); max-width: 60ch; }
  .title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.25; letter-spacing: -0.01em; }
  .fine { margin: -6px 0 0; color: var(--muted); font-size: 0.78rem; line-height: 1.4; max-width: 60ch; }

  .roster {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
    gap: 14px;
  }
  .card {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 16px;
    align-items: start;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .pics { display: flex; flex-direction: column; gap: 8px; }
  .pic {
    position: relative;
    width: 88px;
    height: 88px;
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--pic-bg);
  }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 3px; }
  .pic .tag {
    position: absolute;
    inset: auto 0 0 0;
    padding: 2px 0;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    background: rgba(14, 16, 27, 0.8);
    color: #fff;
    border-radius: 0 0 3px 3px;
  }
  .pic.has-tip { cursor: help; }
  .pic.has-tip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tip {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 5;
    width: max-content;
    max-width: min(240px, 70vw);
    padding: 7px 10px;
    border-radius: 4px;
    background: var(--fg);
    color: var(--bg);
    font-size: 0.82rem;
    line-height: 1.35;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.12s;
  }
  .pic.has-tip:hover .tip, .pic.has-tip:focus .tip { opacity: 1; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .tip { transition: none; } }

  .body { min-width: 0; display: grid; gap: 4px; }
  .name {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.3rem;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .facts { margin: 2px 0 4px; padding: 0; list-style: none; display: grid; gap: 1px; }
  .facts li { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.03em; }
  .facts .k { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-right: 8px; }
  .facts .v { font-weight: 600; }
  .desc { margin: 0; color: var(--fg); font-size: 0.97rem; max-width: 62ch; }
  .desc.empty { color: var(--muted); font-style: italic; }
  .note { margin: 6px 0 0; color: var(--muted); font-size: 0.8rem; line-height: 1.4; max-width: 62ch; }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .story-end {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-block: 6px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .story-end::before, .story-end::after { content: ""; flex: 1; border-top: 1px solid var(--muted); }
  .btn {
    appearance: none;
    font: inherit;
    font-size: 0.85rem;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible, .spoiler:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .tagnotes { display: grid; gap: 6px; flex: 1 1 320px; min-width: 0; }
  .tagnotes p { margin: 0; color: var(--muted); font-size: 0.92rem; max-width: 62ch; }
  .tagnotes strong { color: var(--fg); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 1px 7px;
  }

  .spoiler {
    appearance: none;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: repeating-linear-gradient(135deg, var(--line) 0 6px, transparent 6px 12px);
    border: 1px dashed var(--muted);
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .spoiler:hover { color: var(--fg); border-color: var(--accent); }
  p .spoiler { display: block; padding: 8px 12px; }
  .facts .v:focus, .desc:focus, .note:focus { outline: none; }
</style>

<div class="wrap">
  <header>
    <h1 class="title">Bean Cyance Who’s Who</h1>
    <p class="lede">Characters from Crewbait’s comic, whom she will sometimes play as in Among Us.</p>
    <p class="fine">This is a fan work. There may be errors, and it is subject to change.</p>
    <div class="bar">
      <div class="tagnotes" id="tagnotes"></div>
      <div class="tools" id="tools" hidden>
        <button class="btn" id="toggleAll" type="button" aria-pressed="false">Reveal all spoilers</button>
      </div>
    </div>
  </header>

  <ul class="roster" id="roster"></ul>
</div>

      if (reset) shown = false;
      box.textContent = "";
      if (shown || allShown) {
        // *word* is shown in italics
        text.split(/\*([^*]+)\*/).forEach(function (part, i) {
          if (i % 2) { var em = document.createElement("em"); em.textContent = part; box.appendChild(em); }
          else box.appendChild(document.createTextNode(part));
        });
      } else {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "spoiler";
        b.textContent = "Spoiler \u00b7 reveal";
        b.addEventListener("click", function () {
          shown = true;
          paint(false);
          box.tabIndex = -1;
          box.focus();
        });
        box.appendChild(b);
      }
    }
    if (hidden) painters.push(paint);
    paint();
  }

  function card(c) {
    var spoil = c.spoiler || [];
    function isHidden(key) { return spoil.indexOf(key) !== -1; }

    var li = document.createElement("li");
    li.className = "card";

    var pics = document.createElement("div");
    pics.className = "pics";
    c.imgs.forEach(function (key, i) {
      var fig = document.createElement("figure");
      fig.className = "pic";
      var im = document.createElement("img");
      im.src = IMG[key];
      im.alt = c.name + (i > 0 ? ", alternate appearance" : "");
      fig.appendChild(im);
      var tipText = c.tips && c.tips[i];
      if (tipText) {
        fig.className += " has-tip";
        fig.tabIndex = 0;
        fig.setAttribute("aria-label", c.name + ": " + tipText);
        var tp = document.createElement("span");
        tp.className = "tip";
        tp.setAttribute("role", "tooltip");
        tp.textContent = tipText;
        fig.appendChild(tp);
      }
      if (i > 0) {
        var t = document.createElement("span");
        t.className = "tag";
        t.textContent = "Alt";
        fig.appendChild(t);
      }
      pics.appendChild(fig);
    });

    var body = document.createElement("div");
    body.className = "body";
    var h = document.createElement("h3");
    h.className = "name";
    h.textContent = c.name;
    body.appendChild(h);

    if (c.tags && c.tags.length) {
      var tg = document.createElement("div");
      tg.className = "tags";
      c.tags.forEach(function (name) {
        var s2 = document.createElement("span");
        s2.className = "tag-pill";
        s2.textContent = name;
        tg.appendChild(s2);
      });
      body.appendChild(tg);
    }

    var facts = [["Sex", c.sex, "sex"], ["Crew/Imp", c.role, "role"], ["Canon role", c.canon, "canon"]].filter(function (f) { return f[1]; });
    if (facts.length) {
      var ul = document.createElement("ul");
      ul.className = "facts";
      facts.forEach(function (f) {
        var li2 = document.createElement("li");
        var k = document.createElement("span");
        k.className = "k";
        k.textContent = f[0];
        var v = document.createElement("span");
        v.className = "v";
        spoilable(v, f[1], isHidden(f[2]));
        li2.appendChild(k);
        li2.appendChild(v);
        ul.appendChild(li2);
      });
      body.appendChild(ul);
    }

    var p = document.createElement("p");
    p.className = "desc" + (c.desc ? "" : " empty");
    spoilable(p, c.desc || "Description coming soon.", !!c.desc && isHidden("desc"));
    body.appendChild(p);

    // "secret" is an extra sentence or two of description that always starts hidden.
    if (c.secret) {
      var s = document.createElement("p");
      s.className = "desc";
      spoilable(s, c.secret, true);
      body.appendChild(s);
    }

    if (c.note) {
      var n = document.createElement("p");
      n.className = "note";
      spoilable(n, c.note, isHidden("note"));
      body.appendChild(n);
    }

    li.appendChild(pics);
    li.appendChild(body);
    return li;
  }

  var root = document.getElementById("roster");
  characters.forEach(function (c) {
    if (c.divider) {
      var div = document.createElement("li");
      div.className = "story-end";
      div.textContent = c.divider;
      root.appendChild(div);
    }
    root.appendChild(card(c));
    if (c.endOf) {
      var sep = document.createElement("li");
      sep.className = "story-end";
      sep.textContent = "End of " + c.endOf;
      root.appendChild(sep);
    }
  });

  // Explain each story tag that is in use.
  var notes = document.getElementById("tagnotes");
  var seen = {};
  characters.forEach(function (c) {
    (c.tags || []).forEach(function (name) {
      if (seen[name] || !tagNotes[name]) return;
      seen[name] = true;
      var p = document.createElement("p");
      var b = document.createElement("strong");
      b.textContent = name + ": ";
      p.appendChild(b);
      p.appendChild(document.createTextNode(tagNotes[name]));
      notes.appendChild(p);
    });
  });

  // Reveal-all control only appears when something is hidden.
  if (painters.length) {
    var tools = document.getElementById("tools");
    var btn = document.getElementById("toggleAll");
    tools.hidden = false;
    btn.addEventListener("click", function () {
      allShown = !allShown;
      btn.textContent = allShown ? "Hide spoilers again" : "Reveal all spoilers";
      btn.setAttribute("aria-pressed", allShown ? "true" : "false");
      painters.forEach(function (paint) { paint(!allShown); });
    });
  }
</script>

</body></html>
